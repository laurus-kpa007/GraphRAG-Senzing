[tool.poetry]
name = "graphrag-senzing"
version = "0.1.0"
description = "Agentic GraphRAG pipeline using strwythura with custom document loaders, Ollama gemma3:27b, and BGE-M3 embeddings"
authors = ["GraphRAG-Senzing"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
strwythura = ">=2.0.3"
python-docx = ">=1.1.0"
chardet = ">=5.0.0"
markdown-it-py = ">=3.0.0"
ollama = ">=0.4.0"
httpx = ">=0.27.0"
numpy = ">=1.26.0"
lancedb = ">=0.17.0"
pyarrow = ">=15.0.0"
streamlit = ">=1.40.0"
dspy = ">=2.5.0"
networkx = ">=3.0"
spacy = ">=3.7.0"
gensim = ">=4.3.0"
icecream = ">=2.1.0"
tomli = ">=2.0.0"
requests = ">=2.31.0"
requests-cache = ">=1.2.0"
beautifulsoup4 = ">=4.12.0"
rdflib = ">=7.0.0"
pydantic = ">=2.0.0"
gliner = ">=0.2.0"
gliner-spacy = ">=0.0.10"
polars = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
